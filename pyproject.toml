[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "booruflow"
version = "0.1.0.dev0"
description = "Cross-platform Booru workflow, taxonomy and review toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "YamiNoSho" }]
dependencies = []

[project.gui-scripts]
booruflow = "booruflow.__main__:main"
gelbooru-tagging = "booruflow.presentation.pyside6.tagging_standalone:main"

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
dev = ["pytest>=8", "ruff>=0.9"]
distribution = ["PyInstaller>=6.15,<7"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
